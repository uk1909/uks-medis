name: UKsMedis

options:
  bundleIdPrefix: de.uklink
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  UKsMedis:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        # Bundle-ID muss mit der in App Store Connect angelegten App übereinstimmen
        PRODUCT_BUNDLE_IDENTIFIER: de.uklink.uksmedis
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: "uk's medis"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
