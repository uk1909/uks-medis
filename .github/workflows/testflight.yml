name: Build & TestFlight

on:
  workflow_dispatch:        # manuell über "Run workflow" starten
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"    # täglich prüfen, ob ein Auffrisch-Build fällig ist

permissions:
  contents: read
  actions: write

concurrency:
  group: testflight
  cancel-in-progress: false

env:
  REBUILD_AFTER_DAYS: 80    # TestFlight-Builds laufen nach 90 Tagen ab

jobs:
  # Entscheidet, ob gebaut wird: bei Push/manuell immer,
  # beim täglichen Zeitplan nur, wenn der letzte Build >= 80 Tage alt ist.
  check:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Zeitplan aktiv halten
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # GitHub schaltet Zeitpläne in öffentlichen Repos nach 60 Tagen ohne Aktivität ab.
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/testflight.yml/enable" || true

      - name: Fälligkeit prüfen
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "Kein Zeitplan-Lauf – es wird gebaut."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LAST=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=letzter-build&per_page=1" \
                  --jq '.artifacts[0].created_at // empty')
          if [ -z "$LAST" ]; then
            echo "Kein früherer Build gefunden – es wird gebaut."
            echo "build=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          AGE=$(( ( $(date -u +%s) - $(date -u -d "$LAST" +%s) ) / 86400 ))
          echo "Letzter Build: $LAST (vor $AGE Tagen)"
          if [ "$AGE" -ge "$REBUILD_AFTER_DAYS" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "Noch $(( REBUILD_AFTER_DAYS - AGE )) Tage bis zum nächsten Auffrisch-Build."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: macos-26
    timeout-minutes: 45

    env:
      SCHEME: UKsMedis

    steps:
      - name: Code holen
        uses: actions/checkout@v5

      - name: Neueste stabile Xcode-Version wählen
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          echo "Benutze $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: XcodeGen installieren & Projekt erzeugen
        run: |
          brew install xcodegen
          xcodegen generate

      - name: App Store Connect API-Schlüssel ablegen
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey.p8" >> "$GITHUB_ENV"

      # Kompilieren ohne Signatur – die Signatur passiert beim Export
      # über Apples Cloud-Signierung (kein registriertes Gerät nötig).
      - name: Archiv bauen
        run: |
          set +e
          xcodebuild archive \
            -project UKsMedis.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/UKsMedis.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            > "$RUNNER_TEMP/archive.log" 2>&1
          STATUS=$?
          tail -30 "$RUNNER_TEMP/archive.log"
          if [ "$STATUS" -ne 0 ]; then
            grep -E "error:" "$RUNNER_TEMP/archive.log" | sort -u | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit "$STATUS"
          fi

      - name: Signieren & Upload zu TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF

          set +e
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/UKsMedis.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "${{ secrets.ASC_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.ASC_ISSUER_ID }}" \
            > "$RUNNER_TEMP/export.log" 2>&1
          STATUS=$?
          tail -40 "$RUNNER_TEMP/export.log"
          if [ "$STATUS" -ne 0 ]; then
            grep -iE "error" "$RUNNER_TEMP/export.log" | sort -u | head -20 | while read -r line; do
              echo "::error::$line"
            done
            exit "$STATUS"
          fi

      - name: Schlüssel entfernen
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"

      - name: Build-Datum merken
        run: date -u +%Y-%m-%dT%H:%M:%SZ > "$RUNNER_TEMP/letzter-build.txt"

      - name: Build-Datum speichern
        uses: actions/upload-artifact@v4
        with:
          name: letzter-build
          path: ${{ runner.temp }}/letzter-build.txt
          retention-days: 90
